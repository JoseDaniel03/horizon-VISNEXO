[package]
name = "horizon-official"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The official game executable: the platform's game with Horizon's own in-game parts plugged in (docs/layers.md)"

[[bin]]
name = "horizon-official"
path = "src/main.rs"

[features]
vis-vsclient = ["dep:horizon-client", "dep:horizon-mods"]

[dependencies]
# VIS-only native trait mod is already compiled into the game; players never
# link or execute Rust code from an unreviewed .hnmod at run time.
horizon-client = { path = "../horizon-client", optional = true }
horizon-mods = { path = "../horizon-mods", features = ["index"], optional = true }
horizon-platform = { path = "../horizon-platform" }
horizon-heartbeat = { path = "../horizon-heartbeat" }
horizon-friends = { path = "../horizon-friends", features = ["game"] }
horizon-official-servers = { path = "../horizon-official-servers" }
horizon-discord = { path = "../horizon-discord" }
log = "0.4"

[build-dependencies]
# The build script runs on the host, but embeds resources based on the target OS.
winresource = "0.1"

[lints]
workspace = true

# The Android NativeActivity calls the shared engine directly after register().
[target.'cfg(not(target_os = "android"))'.dependencies]
horizon-game = { path = "../horizon-game" }
