[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
horizon-game = { path = "../horizon-game", default-features = false, features = ["horizon-extras"] }
horizon-platform = { path = "../horizon-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
url = "2"
log = "0.4"
[features]
default = ["audio"]
audio = ["horizon-game/audio"]
[target.'cfg(target_os = "android")'.dependencies]
horizon-official = { path = "../horizon-official" }
winit = { version = "0.30.13", features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.21"
[lints]
workspace = true
