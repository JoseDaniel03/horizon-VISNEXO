name: VSClient MCRust native port
on:
  push:
    paths:
      - 'integrations/vsclient-horizon/**'
      - 'crates/horizon-client/Cargo.toml'
      - 'crates/horizon-client/src/mod_api.rs'
      - 'crates/horizon-client/tests/vsclient_native_port.rs'
      - 'launcher/src/native_mods.rs'
      - 'launcher/src/native_mods_tests.rs'
      - 'launcher/src/native_mods/**'
      - '.github/workflows/visclient-native.yml'
  pull_request:
    paths:
      - 'integrations/vsclient-horizon/**'
      - 'crates/horizon-client/Cargo.toml'
      - 'crates/horizon-client/src/mod_api.rs'
      - 'crates/horizon-client/tests/vsclient_native_port.rs'
      - 'launcher/src/native_mods.rs'
      - 'launcher/src/native_mods_tests.rs'
      - 'launcher/src/native_mods/**'
      - '.github/workflows/visclient-native.yml'

permissions:
  contents: read

concurrency:
  group: vsclient-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run standalone protocol 8 and cinematic parity tests
        run: |
          rustc --edition=2024 --test integrations/vsclient-horizon/api/src/core.rs \
            -o /tmp/visclient-mcrust-protocol-tests
          /tmp/visclient-mcrust-protocol-tests --nocapture
          rustc --edition=2024 --test integrations/vsclient-horizon/api/src/controls.rs \
            -o /tmp/visclient-mcrust-controls-tests
          /tmp/visclient-mcrust-controls-tests --nocapture
          rustc --edition=2024 --test integrations/vsclient-horizon/api/src/feedback.rs \
            -o /tmp/visclient-mcrust-feedback-tests
          /tmp/visclient-mcrust-feedback-tests --nocapture
          rustc --edition=2024 --test integrations/vsclient-horizon/api/src/diagnostics.rs \
            -o /tmp/visclient-mcrust-diagnostics-tests
          /tmp/visclient-mcrust-diagnostics-tests --nocapture
          rustc --edition=2024 --test integrations/vsclient-horizon/api/src/touch.rs \
            -o /tmp/visclient-mcrust-touch-tests
          /tmp/visclient-mcrust-touch-tests --nocapture
      - name: Verify native bundle manifest and supported feature hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          root = Path('integrations/vsclient-horizon')
          data = tomllib.loads((root/'horizon-mixin.toml').read_text())
          assert data['mod']['id'] == 'vsclient'
          assert data['api']['path'] == 'api'
          assert (root/'api/Cargo.toml').is_file()
          source = (root/'api/src/lib.rs').read_text()
          for hook in ('client_packet(', 'camera_pose(', 'compute_fov(',
                       'client_player_network_logging_in(', 'client_disconnecting(',
                       'client_tick_post(', 'key(', 'gui_render_post(',
                       'screen_render_post(', 'screen_key_pressed_pre(', 'screen_mouse_button_pressed_pre(',
                       'camera_shake(', 'render_hand_pose(', 'movement_input(', 'mouse_button_pre(', 'world_primitives(', 'client_tick_post('):
              assert hook in source, hook
          assert 'virgoland:hello' in (root/'api/src/core.rs').read_text()
          assert not list(root.rglob('*.jar'))
          print('Native VSClient bundle manifest and API hooks passed')
          PY
      - name: Build source bundle for VIS Nexo native-build
        run: |
          tar -czf VSClient-MCRust-native-source.tar.gz -C integrations vsclient-horizon
          test -s VSClient-MCRust-native-source.tar.gz
          sha256sum VSClient-MCRust-native-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: VSClient-MCRust-native-source
          path: VSClient-MCRust-native-source.tar.gz
          retention-days: 21
          if-no-files-found: error
  native-api:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile VSClient adapter against Horizon's real native hook trait
        run: |
          cargo check --locked -p horizon-client --test vsclient_native_port --no-default-features

  embedded-client:
    name: VSClient prelinked gameplay client
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native client system audio and controller libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Typecheck complete Horizon client with built-in VSClient feature
        run: |
          cargo check --locked -p horizon-client --bin horizon-client --features vis-vsclient
          cargo check --locked -p horizon-client --bin horizon-client --no-default-features --features vis-vsclient

  native-loader:
    name: Native mod recognition and install
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: vsclient-native-loader
      - name: Install Linux libraries required by Horizon launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf
      - name: Verify .hnmod is detected and its fork SHA is preserved
        run: |
          cargo test --manifest-path launcher/Cargo.toml --locked --lib             native_archive_file_is_discovered_as_trait_mod_without_unzipping -- --nocapture

  package:
    name: Installable .hnmod
    needs: [protocol, native-api, native-loader]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Package the actual Horizon native mod
        env:
          HORIZON_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p dist
          python3 integrations/vsclient-horizon/package_native.py \
            --horizon "$HORIZON_SHA" \
            --out dist/VSClient-MCRust-0.4.1.hnmod
          sha256sum dist/VSClient-MCRust-0.4.1.hnmod | tee dist/SHA256SUMS.txt
          cat > dist/INSTALAR.txt <<'EOF'
          VSCLIENT MCRUST 0.4.1 - MOD NATIVO HORIZON
          ============================================
          Archivo: VSClient-MCRust-0.4.1.hnmod
          No es un .jar de Fabric ni una APK. Horizon compila este mod nativo
          con el cliente de Minecraft Rust en la instancia elegida.
          Para instalarlo, extraé primero este .hnmod del ZIP descargado
          de GitHub Actions. En el launcher del fork VIS, podés usar:
            horizon-launcher native-build VSClient-MCRust-0.4.1.hnmod --instance INSTANCIA --allow-version-mismatch --trust-native-code
          O copiá el .hnmod renombrado a vsclient.hnmod dentro de
            INSTANCIA/horizon-native-mods/
          y activá el mod en la lista de la instancia antes de compilarlo.
          OPCIÓN SIN EDITAR CARPETAS A MANO EN PC (Python 3):
            python3 INSTALAR_VSCLIENT.py --instance CARPETA_INSTANCIA --hnmod VSClient-MCRust-0.4.1.hnmod --replace
          El instalador activa mod.vsclient:true pero NO ejecuta ni compila
          código nativo. La aprobación se hace en la pantalla Native build.
          Requiere un launcher del fork actualizado con reconocimiento directo
          de .hnmod y resolución de commits de JoseDaniel03/horizon-VISNEXO.
          El launcher oficial anterior no reconocerá el fork ni la APK Android
          aceptará por sí sola un mod nativo sin compilar. Si la versión difiere,
          no instales encima de tus mundos: usá una instancia separada.
          Funciones: cámaras V1, FOV/zoom, controles de servidor, interfaz y
          acciones táctiles, V3 experimental, efectos VSRender y diagnóstico.
          No verificado dentro del juego ni en Android ARM64. El compositor
          multicámara y los actores BBModel completos siguen pendientes.
          Revisá el código: es nativo y requiere tu aprobación expresa.
          EOF
      - name: Validate with Horizon's real .hnmod bundle reader
        env:
          HORIZON_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p crates/horizon-mods/tests
          cat > crates/horizon-mods/tests/vsclient_package_ci.rs <<'EOF'
          #[test]
          fn accepts_vsclient_native_mod_manifest_and_source_files() {
              let path = std::path::Path::new(env!("CARGO_MANIFEST_DIR"))
                  .join("../../dist/VSClient-MCRust-0.4.1.hnmod");
              let bundle = horizon_mods::index::native::Bundle::read(&path)
                  .expect("Horizon must accept the installable .hnmod archive");
              assert_eq!(bundle.manifest.id, "vsclient");
              assert_eq!(bundle.manifest.version, "0.4.1");
              assert_eq!(bundle.manifest.game, "26.3");
              // VSClient requires the fork's CustomPayload additions, not only
              // the numeric native hooks version shared by other revisions.
              assert_eq!(bundle.manifest.hooks, None);
              assert_eq!(bundle.manifest.horizon, std::env::var("HORIZON_SHA").unwrap());
              assert!(bundle.files.contains_key("mixins/vsclient/api/src/lib.rs"));
              assert!(bundle.files.contains_key("mixins/vsclient/horizon-mixin.toml"));
          }
          EOF
          cargo test --locked -p horizon-mods --features index --test vsclient_package_ci -- --nocapture
      - name: Install VSClient in isolated Horizon instance and verify recognition
        run: |
          cp integrations/vsclient-horizon/install_vsclient.py dist/INSTALAR_VSCLIENT.py
          mkdir -p /tmp/vsclient-horizon-test-instance
          python3 dist/INSTALAR_VSCLIENT.py \
            --hnmod dist/VSClient-MCRust-0.4.1.hnmod \
            --instance /tmp/vsclient-horizon-test-instance --check-only
          python3 dist/INSTALAR_VSCLIENT.py \
            --hnmod dist/VSClient-MCRust-0.4.1.hnmod \
            --instance /tmp/vsclient-horizon-test-instance
          test -s /tmp/vsclient-horizon-test-instance/horizon-native-mods/vsclient.hnmod
          grep -qx 'mod.vsclient:true' /tmp/vsclient-horizon-test-instance/horizon-mods.txt
          python3 dist/INSTALAR_VSCLIENT.py \
            --hnmod dist/VSClient-MCRust-0.4.1.hnmod \
            --instance /tmp/vsclient-horizon-test-instance --replace
          grep -cx 'mod.vsclient:true' /tmp/vsclient-horizon-test-instance/horizon-mods.txt | grep -qx '1'
      - uses: actions/upload-artifact@v4
        with:
          name: VSClient-MCRust-0.4.1-HNMOD
          path: |
            dist/VSClient-MCRust-0.4.1.hnmod
            dist/SHA256SUMS.txt
            dist/INSTALAR.txt
            dist/INSTALAR_VSCLIENT.py
          retention-days: 30
          if-no-files-found: error
